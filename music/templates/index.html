<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoplak Music Player</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/>
        </svg>
        <h1>Shoplak Music Player</h1>
      </div>
      <p class="subtitle">Search any artist and song to start listening</p>
    </header>

    <form id="search-form" class="search-form" autocomplete="off">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Metallica - Enter Sandman"
          aria-label="Search for artist and song"
        >
        <button type="submit" id="search-btn">Search</button>
      </div>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="player" class="player hidden" aria-label="Shoplak Music Player">
      <div class="player-artwork">
        <img id="artwork" src="" alt="" class="artwork-img">
        <div class="artwork-placeholder" id="artwork-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
      </div>

      <div class="player-info">
        <h2 id="track-title" class="track-title">—</h2>
        <p id="track-artist" class="track-artist">—</p>
      </div>

      <div class="progress-section">
        <div class="progress-bar" id="progress-bar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <div class="time-labels">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button type="button" id="prev-btn" class="control-btn secondary" aria-label="Previous track">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <polygon points="19,20 9,12 19,4"/>
            <rect x="5" y="4" width="3" height="16"/>
          </svg>
        </button>
        <button type="button" id="play-pause-btn" class="control-btn play-pause" aria-label="Play">
          <svg id="icon-play" class="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="8,5 19,12 8,19"/>
          </svg>
          <svg id="icon-pause" class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="5" width="4" height="14"/>
            <rect x="14" y="5" width="4" height="14"/>
          </svg>
        </button>
        <button type="button" id="next-btn" class="control-btn secondary" aria-label="Next track">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,4 15,12 5,20"/>
            <rect x="16" y="4" width="3" height="16"/>
          </svg>
        </button>
      </div>

      <audio id="audio" preload="metadata"></audio>
    </section>

    <section id="track-list-section" class="track-list-section hidden" aria-label="Song list">
      <h3 id="track-list-heading" class="track-list-heading">Songs</h3>
      <ul id="track-list" class="track-list" role="listbox" aria-label="Select a song"></ul>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
